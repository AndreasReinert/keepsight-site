<p><a href="mailto:keepsight.support@gmail.com">keepsight.support@gmail.com</a></p>
<p>為了讓我儘快提供幫助，請附上：</p>
<ul>
<li>你的 iPhone 型號和 iOS 版本</li>
<li>Keepsight 版本（在 App 的“所有設定”→“關於與許可”中）</li>
<li>你做了什麼、實際發生了什麼，最好附上截圖或短影片</li>
</ul>
