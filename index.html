<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keepsight</title>
<script>
// Sprache: zuerst die gemerkte Wahl, dann die Sprachen des Browsers, sonst Englisch
(function () {
  var available = ['en', 'de', 'fr', 'it', 'es', 'pt-BR', 'nl', 'sv', 'pl', 'ru', 'uk', 'tr', 'ar', 'hi', 'id', 'vi', 'th', 'ja', 'ko', 'zh-Hans', 'zh-Hant'], chosen = null;
  try { chosen = localStorage.getItem('ks-lang'); } catch (e) {}
  if (available.indexOf(chosen) < 0) {
    chosen = null;
    var wanted = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (var i = 0; i < wanted.length && !chosen; i++) {
      var tag = String(wanted[i]).toLowerCase(), code = tag.split('-')[0];
      if (code === 'zh') chosen = /hant|tw|hk|mo/.test(tag) ? 'zh-Hant' : 'zh-Hans';
      else if (code === 'pt') chosen = 'pt-BR';
      else if (available.indexOf(code) >= 0) chosen = code;
      if (available.indexOf(chosen) < 0) chosen = null;
    }
  }
  location.replace((chosen || 'en') + '/' + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
</head>
<body><p>Keepsight: <a href="en/">English</a> · <a href="de/">Deutsch</a> · <a href="fr/">Français</a> · <a href="it/">Italiano</a> · <a href="es/">Español</a> · <a href="pt-BR/">Português (Brasil)</a> · <a href="nl/">Nederlands</a> · <a href="sv/">Svenska</a> · <a href="pl/">Polski</a> · <a href="ru/">Русский</a> · <a href="uk/">Українська</a> · <a href="tr/">Türkçe</a> · <a href="ar/">العربية</a> · <a href="hi/">हिन्दी</a> · <a href="id/">Bahasa Indonesia</a> · <a href="vi/">Tiếng Việt</a> · <a href="th/">ไทย</a> · <a href="ja/">日本語</a> · <a href="ko/">한국어</a> · <a href="zh-Hans/">简体中文</a> · <a href="zh-Hant/">繁體中文</a></p></body>
</html>
